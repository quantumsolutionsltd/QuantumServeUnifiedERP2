<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>QuantumServe - Offline</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #0a0a0c;
      color: #f0eee8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .offline-card {
      background: #111114;
      border: 1px solid rgba(212,168,67,0.15);
      border-radius: 32px;
      padding: 48px 40px;
      max-width: 480px;
      text-align: center;
    }
    .signal-icon { font-size: 56px; margin-bottom: 24px; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    h1 { font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 12px; }
    p { color: rgba(240,238,232,0.5); font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
    .module-status {
      display: grid; grid-template-columns: repeat(2,1fr);
      gap: 12px; margin: 24px 0;
      text-align: left;
    }
    .module { padding: 10px 12px; background: #18181c; border-radius: 12px; font-size: 12px; }
    .online { color: #2ecc71; }
    .partial { color: #f39c12; }
    .offline { color: #e74c3c; }
    .retry-btn {
      background: linear-gradient(135deg, #d4a843, #8a6010);
      border: none; border-radius: 40px;
      padding: 12px 32px; font-size: 14px; font-weight: 600;
      color: #0d0d0f; cursor: pointer;
      margin-top: 16px;
    }
    .retry-btn:hover { transform: translateY(-1px); }
  </style>
</head>
<body>
<div class="offline-card">
  <div class="signal-icon">📡</div>
  <h1>Connection Lost</h1>
  <p>QuantumServe Unified ERP is running in offline mode. Your data is safe and will sync automatically when connection returns.</p>
  <div class="module-status">
    <div class="module"><span class="online">✓</span> Sales & POS</div>
    <div class="module"><span class="online">✓</span> Inventory</div>
    <div class="module"><span class="partial">◐</span> Service Desk</div>
    <div class="module"><span class="partial">◐</span> CRM</div>
    <div class="module"><span class="partial">◐</span> HR</div>
    <div class="module"><span class="offline">✗</span> Live Reports</div>
  </div>
  <button class="retry-btn" onclick="window.location.reload()">⟳ Try Again</button>
  <p style="margin-top: 20px; font-size: 11px;">Auto-reconnect when internet is restored</p>
</div>
<script>
  window.addEventListener('online', () => window.location.reload());
</script>
</body>
</html>

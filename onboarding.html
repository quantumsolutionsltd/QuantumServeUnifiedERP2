<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>QuantumServe - Setup Wizard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #0a0a0c;
      color: #f0eee8;
      min-height: 100vh;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    .progress-bar { background: rgba(255,255,255,0.06); border-radius: 20px; height: 6px; margin-bottom: 40px; }
    .progress-fill { background: linear-gradient(90deg, #d4a843, #f0c870); border-radius: 20px; height: 100%; width: 0%; transition: width 0.3s; }
    .step-card {
      background: #111114;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 24px;
      padding: 40px;
    }
    .step-title { font-family: 'Playfair Display', serif; font-size: 24px; margin-bottom: 8px; }
    .step-desc { color: rgba(240,238,232,0.6); font-size: 13px; margin-bottom: 32px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; color: rgba(240,238,232,0.8); }
    input, select, textarea {
      width: 100%; background: #18181c;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px; padding: 12px 14px;
      font-size: 14px; color: #f0eee8;
      font-family: 'Outfit', sans-serif;
    }
    input:focus, select:focus { outline: none; border-color: #d4a843; }
    textarea { resize: vertical; }
    .btn-group { display: flex; gap: 12px; margin-top: 32px; }
    .btn-primary {
      background: linear-gradient(135deg, #d4a843, #8a6010);
      border: none; border-radius: 10px; padding: 12px 24px;
      font-size: 14px; font-weight: 600; color: #0d0d0f; cursor: pointer; flex: 1;
    }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: transparent; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 12px 24px;
      font-size: 14px; color: rgba(240,238,232,0.8); cursor: pointer;
    }
    .error-msg {
      background: rgba(231,76,60,0.1); border: 1px solid rgba(231,76,60,0.2);
      border-radius: 10px; padding: 12px; font-size: 12px; color: #e74c3c;
      margin-bottom: 20px;
    }
    .success-msg {
      background: rgba(46,204,113,0.1); border: 1px solid rgba(46,204,113,0.2);
      border-radius: 10px; padding: 12px; font-size: 12px; color: #2ecc71;
      margin-bottom: 20px;
    }
    .step-indicator { display: flex; justify-content: space-between; margin-bottom: 30px; flex-wrap: wrap; gap: 8px; }
    .step-dot {
      width: 36px; height: 36px; border-radius: 50%;
      background: #18181c; border: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600; color: rgba(240,238,232,0.4);
    }
    .step-dot.active { background: linear-gradient(135deg, #d4a843, #8a6010); color: #0d0d0f; border: none; }
    .step-dot.completed { background: #2ecc71; color: #0d0d0f; border: none; }
    .coa-preview {
      background: #18181c; border-radius: 10px; padding: 12px;
      font-size: 11px; color: rgba(240,238,232,0.6); margin-top: 12px;
      max-height: 200px; overflow-y: auto;
    }
    .coa-row { display: flex; gap: 12px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .coa-code { font-family: monospace; color: #d4a843; min-width: 50px; }
    .users-list { margin: 16px 0; }
    .user-invite {
      background: #18181c; border-radius: 8px; padding: 10px; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    @media (max-width: 640px) {
      .step-card { padding: 24px; }
      .step-title { font-size: 20px; }
      .step-dot { width: 28px; height: 28px; font-size: 11px; }
      .btn-group { flex-direction: column; }
    }
  </style>
</head>

async function init() {
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true }
  });

  const { data: { session } } = await supabase.auth.getSession();
  
  // Get tenant_id from users table if exists
  if (session) {
    const { data: userData } = await supabase
      .from('users')
      .select('tenant_id')
      .eq('auth_user_id', session.user.id)
      .single();
    if (userData) onboardingData.tenant_id = userData.tenant_id;
  }

  // Check if tenant exists and onboarding status
  if (onboardingData.tenant_id) {
    const { data: tenant } = await supabase
      .from('tenants')
      .select('onboarding_step, onboarding_completed_at, name, timezone, date_format')
      .eq('id', onboardingData.tenant_id)
      .single();
    
    if (tenant?.onboarding_completed_at) {
      window.location.href = '/';
      return;
    }
    if (tenant) {
      currentStep = tenant.onboarding_step || 1;
      if (tenant.name) onboardingData.companyName = tenant.name;
      if (tenant.timezone) onboardingData.timezone = tenant.timezone;
      if (tenant.date_format) onboardingData.dateFormat = tenant.date_format;
    }
  } else {
    // No tenant yet - create one
    const { data: newTenant, error: tenantError } = await supabase
      .from('tenants')
      .insert({
        name: 'New Company',
        timezone: 'UTC',
        date_format: 'YYYY-MM-DD',
        onboarding_step: 1
      })
      .select()
      .single();
    
    if (tenantError) {
      console.error('Error creating tenant:', tenantError);
    } else if (newTenant) {
      onboardingData.tenant_id = newTenant.id;
    }
  }

  renderStepIndicator();
  renderStep(currentStep);
}

function renderStepIndicator() {
  const labels = ['Company', 'Settings', 'Fiscal Year', 'Accounts', 'Tax', 'Structure', 'Admin User', 'Complete'];
  const container = document.getElementById('stepIndicator');
  container.innerHTML = labels.map((lbl, i) => `
    <div class="step-dot ${i + 1 === currentStep ? 'active' : (i + 1 < currentStep ? 'completed' : '')}" title="${lbl}">
      ${i + 1 < currentStep ? '✓' : (i + 1)}
    </div>
  `).join('');
  document.getElementById('progressFill').style.width = `${((currentStep - 1) / (TOTAL_STEPS - 1)) * 100}%`;
}

function renderStep(step) {
  const steps = {
    1: renderCompanyStep,
    2: renderSettingsStep,
    3: renderFiscalYearStep,
    4: renderChartOfAccountsStep,
    5: renderTaxStep,
    6: renderOrgStructureStep,
    7: renderAdminUserStep,
    8: renderCompleteStep
  };
  const fn = steps[step];
  if (fn) fn();
}

// STEP SAVE LOGIC
// ============================================================
async function saveCurrentStep() {
  clearMessages();

  // STEP 1: Company Profile
  if (currentStep === 1) {
    const name = val('companyName');
    if (!name) { showError('Company name is required.'); return false; }
    onboardingData.companyName = name;
    onboardingData.legalName = val('legalName');
    onboardingData.taxId = val('taxId');
    onboardingData.country = val('country');

    const { error } = await supabase
      .from('tenants')
      .update({ name: onboardingData.companyName, tax_id: onboardingData.taxId })
      .eq('id', onboardingData.tenant_id);
    if (error) { showError('Failed to save company profile: ' + error.message); return false; }
  }

  // STEP 2: Settings
  if (currentStep === 2) {
    onboardingData.timezone = val('timezone');
    onboardingData.dateFormat = val('dateFormat');
    onboardingData.currencyCode = val('currency');

    const { error } = await supabase
      .from('tenants')
      .update({ timezone: onboardingData.timezone, date_format: onboardingData.dateFormat })
      .eq('id', onboardingData.tenant_id);
    if (error) { showError('Failed to save settings: ' + error.message); return false; }
  }

  // STEP 3: Fiscal Year
  if (currentStep === 3) {
    onboardingData.fyName = val('fyName');
    onboardingData.fyStart = val('fyStart');
    onboardingData.fyEnd = val('fyEnd');

    if (!onboardingData.fyStart || !onboardingData.fyEnd) {
      showError('Fiscal year dates are required.');
      return false;
    }
  }

  // STEP 5: Tax
  if (currentStep === 5) {
    onboardingData.taxName = val('taxName');
    onboardingData.taxRate = parseFloat(val('taxRate')) || 0;
    onboardingData.taxType = val('taxType');
  }

  // STEP 6: Organisation Structure
  if (currentStep === 6) {
    onboardingData.orgName = val('orgName') || 'My Organisation';
    onboardingData.entityName = val('entityName') || 'Main Entity';
    onboardingData.entityCode = (val('entityCode') || 'ENT').toUpperCase();
    onboardingData.branchName = val('branchName') || 'Headquarters';
    onboardingData.branchCode = (val('branchCode') || 'HQ').toUpperCase();
  }

  // STEP 7: Admin User
  if (currentStep === 7) {
    onboardingData.adminFirstName = val('adminFirstName');
    onboardingData.adminLastName = val('adminLastName');
    onboardingData.adminEmail = val('adminEmail');
    onboardingData.adminPassword = val('adminPassword');
    const confirmPassword = val('adminPasswordConfirm');

    if (!onboardingData.adminEmail) { showError('Admin email is required.'); return false; }
    if (!onboardingData.adminPassword) { showError('Password is required.'); return false; }
    if (onboardingData.adminPassword !== confirmPassword) { showError('Passwords do not match.'); return false; }
  }

  return true;
}

// ============================================================
// DATA CREATION FUNCTIONS
// ============================================================
async function createOrganizationStructure() {
  // Create Organization
  const { data: org, error: orgErr } = await supabase
    .from('organizations')
    .insert({ tenant_id: onboardingData.tenant_id, name: onboardingData.orgName })
    .select()
    .single();
  if (orgErr) throw new Error('Failed to create organization: ' + orgErr.message);
  onboardingData.org_id = org.id;

  // Create Entity
  const { data: entity, error: entErr } = await supabase
    .from('entities')
    .insert({
      tenant_id: onboardingData.tenant_id,
      organization_id: onboardingData.org_id,
      code: onboardingData.entityCode,
      name: onboardingData.entityName,
      country: onboardingData.country,
      is_head_office: true
    })
    .select()
    .single();
  if (entErr) throw new Error('Failed to create entity: ' + entErr.message);
  onboardingData.entity_id = entity.id;

  // Create Branch
  const { error: branchErr } = await supabase
    .from('branches')
    .insert({
      tenant_id: onboardingData.tenant_id,
      entity_id: onboardingData.entity_id,
      code: onboardingData.branchCode,
      name: onboardingData.branchName
    });
  if (branchErr) throw new Error('Failed to create branch: ' + branchErr.message);
}

async function createFiscalYear() {
  const { data: fy, error: fyErr } = await supabase
    .from('fiscal_years')
    .insert({
      tenant_id: onboardingData.tenant_id,
      entity_id: onboardingData.entity_id,
      name: onboardingData.fyName,
      start_date: onboardingData.fyStart,
      end_date: onboardingData.fyEnd
    })
    .select()
    .single();
  if (fyErr) throw new Error('Failed to create fiscal year: ' + fyErr.message);

  // Create 12 monthly periods
  const periods = [];
  const start = new Date(onboardingData.fyStart);
  for (let i = 0; i < 12; i++) {
    const pStart = new Date(start.getFullYear(), start.getMonth() + i, 1);
    const pEnd = new Date(start.getFullYear(), start.getMonth() + i + 1, 0);
    periods.push({
      tenant_id: onboardingData.tenant_id,
      fiscal_year_id: fy.id,
      period_number: i + 1,
      start_date: pStart.toISOString().split('T')[0],
      end_date: pEnd.toISOString().split('T')[0]
    });
  }
  const { error: pErr } = await supabase.from('periods').insert(periods);
  if (pErr) throw new Error('Failed to create periods: ' + pErr.message);
}

async function createChartOfAccounts() {
  const accounts = COA_TEMPLATE.map(acc => ({
    tenant_id: onboardingData.tenant_id,
    entity_id: onboardingData.entity_id,
    code: acc.code,
    name: acc.name,
    type: acc.type,
    subtype: acc.subtype,
    is_active: true
  }));
  const { error: coaErr } = await supabase.from('accounts').insert(accounts);
  if (coaErr && !coaErr.message.includes('duplicate')) {
    throw new Error('Failed to create chart of accounts: ' + coaErr.message);
  }
}

async function createTaxCodes() {
  const { error: taxErr } = await supabase.from('tax_codes').insert({
    tenant_id: onboardingData.tenant_id,
    entity_id: onboardingData.entity_id,
    code: 'STD',
    name: onboardingData.taxName,
    rate: onboardingData.taxRate,
    type: onboardingData.taxType,
    is_active: true
  });
  if (taxErr && !taxErr.message.includes('duplicate')) {
    throw new Error('Failed to create tax code: ' + taxErr.message);
  }
}

async function createAdminUser() {
  // Check if user already exists in Auth
  const { data: existingUser } = await supabase.auth.admin.getUserById ? null : null;
  
  // Sign up the admin user
  const { data: authData, error: authError } = await supabase.auth.signUp({
    email: onboardingData.adminEmail,
    password: onboardingData.adminPassword,
    options: {
      data: {
        first_name: onboardingData.adminFirstName,
        last_name: onboardingData.adminLastName
      }
    }
  });

  if (authError) throw new Error('Failed to create auth user: ' + authError.message);

  const authUserId = authData.user.id;

  // Create user record in users table
  const { data: userData, error: userError } = await supabase
    .from('users')
    .insert({
      id: crypto.randomUUID(),
      tenant_id: onboardingData.tenant_id,
      auth_user_id: authUserId,
      username: onboardingData.adminEmail.split('@')[0],
      email: onboardingData.adminEmail,
      first_name: onboardingData.adminFirstName,
      last_name: onboardingData.adminLastName,
      is_active: true,
      is_tenant_admin: true
    })
    .select()
    .single();

  if (userError) throw new Error('Failed to create user record: ' + userError.message);

  // Get System Admin role ID
  const { data: roleData, error: roleError } = await supabase
    .from('roles')
    .select('id')
    .eq('name', 'System Admin')
    .eq('tenant_id', onboardingData.tenant_id)
    .single();

  if (roleError) throw new Error('Failed to find System Admin role: ' + roleError.message);

  // Assign role to user
  const { error: urError } = await supabase
    .from('user_roles')
    .insert({
      id: crypto.randomUUID(),
      tenant_id: onboardingData.tenant_id,
      user_id: userData.id,
      role_id: roleData.id,
      entity_id: onboardingData.entity_id
    });

  if (urError) throw new Error('Failed to assign role: ' + urError.message);
}

// ============================================================
// NAVIGATION
// ============================================================
async function nextStep() {
  const btn = document.querySelector('.btn-primary');
  if (btn) btn.disabled = true;

  const saved = await saveCurrentStep();

  if (!saved) {
    if (btn) btn.disabled = false;
    return;
  }

  // If moving from step 7 to 8, create all data
  if (currentStep === 7) {
    try {
      showSuccess('Creating your company setup... Please wait.');
      await createOrganizationStructure();
      await createFiscalYear();
      await createChartOfAccounts();
      await createTaxCodes();
      await createAdminUser();
      showSuccess('Setup completed successfully!');
    } catch (err) {
      showError(err.message);
      if (btn) btn.disabled = false;
      return;
    }
  }

  if (currentStep < TOTAL_STEPS) {
    currentStep++;
    await supabase
      .from('tenants')
      .update({ onboarding_step: currentStep })
      .eq('id', onboardingData.tenant_id);
    renderStepIndicator();
    renderStep(currentStep);
  }

  if (btn) btn.disabled = false;
}

async function prevStep() {
  if (currentStep > 1) {
    currentStep--;
    await supabase
      .from('tenants')
      .update({ onboarding_step: currentStep })
      .eq('id', onboardingData.tenant_id);
    renderStepIndicator();
    renderStep(currentStep);
  }
}

async function finishOnboarding() {
  await supabase
    .from('tenants')
    .update({
      onboarding_step: TOTAL_STEPS,
      onboarding_completed_at: new Date().toISOString()
    })
    .eq('id', onboardingData.tenant_id);

  // Redirect to login page
  window.location.href = '/';
}

// ============================================================
// HELPERS
// ============================================================
function val(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

function updateCountryDefaults() {
  const countryCode = document.getElementById('country')?.value;
  const country = COUNTRIES.find(c => c.code === countryCode);
  if (country) {
    onboardingData.country = countryCode;
    onboardingData.currencyCode = country.currency;
    const taxRateField = document.getElementById('taxRate');
    if (taxRateField && !taxRateField.value) taxRateField.value = country.tax_rate;
    const taxNameField = document.getElementById('taxName');
    if (taxNameField && !taxNameField.value) taxNameField.value = country.tax_name;
    const currencyField = document.getElementById('currency');
    if (currencyField) currencyField.value = country.currency;
  }
}

function showError(msg) {
  clearMessages();
  const div = document.createElement('div');
  div.className = 'error-msg';
  div.textContent = msg;
  document.getElementById('stepContent').insertBefore(div, document.querySelector('.btn-group'));
  setTimeout(() => div.remove(), 3000);
}

function showSuccess(msg) {
  clearMessages();
  const div = document.createElement('div');
  div.className = 'success-msg';
  div.textContent = msg;
  document.getElementById('stepContent').insertBefore(div, document.querySelector('.btn-group'));
  setTimeout(() => div.remove(), 3000);
}

function clearMessages() {
  document.querySelectorAll('.error-msg, .success-msg').forEach(el => el.remove());
}

// Start the onboarding
init();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>QuantumServe — Setup Wizard</title>
  <link rel="icon" href="icons/favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #0d0d0f;
      --bg2:    #141416;
      --bg3:    #1a1a1e;
      --gold:   #d4a843;
      --gold2:  #f0c870;
      --text:   #f0eee8;
      --text2:  rgba(240,238,232,0.6);
      --text3:  rgba(240,238,232,0.3);
      --border: rgba(255,255,255,0.07);
      --red:    #f87171;
      --green:  #3ecf8e;
      --r:      12px;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    /* Progress */
    .progress-bar {
      background: rgba(255,255,255,0.06);
      border-radius: 20px;
      height: 5px;
      margin-bottom: 36px;
    }
    .progress-fill {
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      border-radius: 20px;
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* Step dots */
    .step-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .step-dot {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--bg3);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
      color: var(--text3);
      transition: all 0.25s;
    }
    .step-dot.active  { background: linear-gradient(135deg, var(--gold), #8a6010); color: #0d0d0f; border: none; }
    .step-dot.done    { background: var(--green); color: #0d0d0f; border: none; font-size: 13px; }

    /* Card */
    .step-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
    }
    @media (max-width: 600px) { .step-card { padding: 24px 20px; } }

    .step-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px; margin-bottom: 6px;
    }
    .step-desc { font-size: 13px; color: var(--text2); margin-bottom: 28px; line-height: 1.5; }

    /* Form */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }
    .form-group { margin-bottom: 16px; }
    .form-group.full { grid-column: 1 / -1; }
    label {
      display: block;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--text3); margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 11px 14px;
      font-size: 13px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--gold); }
    select option { background: var(--bg3); }

    /* Buttons */
    .btn-group { display: flex; gap: 12px; margin-top: 28px; }
    .btn-primary {
      flex: 1;
      background: linear-gradient(135deg, var(--gold), #8a6010);
      border: none; border-radius: var(--r);
      padding: 13px 24px;
      font-size: 14px; font-weight: 600;
      color: #0d0d0f; cursor: pointer;
      font-family: 'Outfit', sans-serif;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 13px 24px;
      font-size: 14px;
      color: var(--text2); cursor: pointer;
      font-family: 'Outfit', sans-serif;
      transition: border-color 0.2s;
    }
    .btn-secondary:hover { border-color: rgba(255,255,255,0.2); }

    /* Error / Info */
    .error-box {
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: var(--r);
      padding: 12px 14px;
      font-size: 12px; color: var(--red);
      margin-bottom: 18px;
      display: none;
    }
    .info-box {
      background: rgba(212,168,67,0.07);
      border: 1px solid rgba(212,168,67,0.15);
      border-radius: var(--r);
      padding: 14px 16px;
      font-size: 13px; color: var(--text2);
      line-height: 1.55;
      margin-bottom: 20px;
    }
    .coa-preview {
      max-height: 240px; overflow-y: auto;
      margin-top: 14px;
    }
    .coa-row {
      display: flex; gap: 12px; align-items: center;
      padding: 7px 0; border-bottom: 1px solid var(--border);
      font-size: 12px; color: var(--text2);
    }
    .coa-row:last-child { border-bottom: none; }
    .coa-code { font-family: monospace; color: var(--gold); min-width: 48px; }
    .coa-type { font-size: 10px; background: rgba(255,255,255,0.05); border-radius: 4px; padding: 2px 6px; }
    .complete-icon { text-align: center; font-size: 64px; margin: 24px 0; }
  </style>
</head>
<body>
<div class="container">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="step-dots" id="stepDots"></div>
  <div class="step-card">
    <div class="error-box" id="errorBox"></div>
    <div id="stepContent"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════
// CONFIG — use the same credentials as index.html
// ════════════════════════════════════════════════
const SUPABASE_URL  = 'https://wydruoodbjuhppdofmss.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5ZHJ1b29kYmp1aHBwZG9mbXNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MTY3NTUsImV4cCI6MjA5NDM5Mjc1NX0.Z7mcAPzcAowKTWS73f_gOmhFxBPaJzWzEwLucuvIfW0';

const TOTAL_STEPS = 7;
const STEP_LABELS = ['Company', 'Structure', 'Fiscal Year', 'Accounts', 'Tax Codes', 'Team', 'Complete'];

// Standard Chart of Accounts template
const COA_TEMPLATE = [
  { code: '1000', name: 'Cash & Cash Equivalents',    type: 'Asset',     subtype: 'CurrentAsset' },
  { code: '1100', name: 'Accounts Receivable',         type: 'Asset',     subtype: 'CurrentAsset' },
  { code: '1200', name: 'Inventory',                   type: 'Asset',     subtype: 'CurrentAsset' },
  { code: '1300', name: 'Prepaid Expenses',            type: 'Asset',     subtype: 'CurrentAsset' },
  { code: '1500', name: 'Property, Plant & Equipment', type: 'Asset',     subtype: 'FixedAsset' },
  { code: '1600', name: 'Accumulated Depreciation',    type: 'Asset',     subtype: 'FixedAsset' },
  { code: '2000', name: 'Accounts Payable',            type: 'Liability', subtype: 'CurrentLiability' },
  { code: '2100', name: 'VAT / Tax Payable',           type: 'Liability', subtype: 'CurrentLiability' },
  { code: '2200', name: 'Accrued Liabilities',         type: 'Liability', subtype: 'CurrentLiability' },
  { code: '2500', name: 'Long-Term Debt',              type: 'Liability', subtype: 'LongTermLiability' },
  { code: '3000', name: "Owner's Equity",              type: 'Equity',    subtype: 'Equity' },
  { code: '3100', name: 'Retained Earnings',           type: 'Equity',    subtype: 'Equity' },
  { code: '4000', name: 'Sales Revenue',               type: 'Revenue',   subtype: 'Revenue' },
  { code: '4100', name: 'Service Revenue',             type: 'Revenue',   subtype: 'Revenue' },
  { code: '5000', name: 'Cost of Goods Sold',          type: 'COGS',      subtype: 'COGS' },
  { code: '6000', name: 'Salaries & Wages',            type: 'Expense',   subtype: 'Operating' },
  { code: '6100', name: 'Rent Expense',                type: 'Expense',   subtype: 'Operating' },
  { code: '6200', name: 'Utilities',                   type: 'Expense',   subtype: 'Operating' },
  { code: '6300', name: 'Marketing & Advertising',     type: 'Expense',   subtype: 'Operating' },
  { code: '6400', name: 'Depreciation Expense',        type: 'Expense',   subtype: 'Operating' },
  { code: '6900', name: 'Other Operating Expenses',    type: 'Expense',   subtype: 'Operating' },
];

// ════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════
let supabase = null;
let currentStep = 1;
let session = null;
let od = {
  tenant_id:  null,   // UUID (from auth.users / tenants table)
  org_id:     null,
  entity_id:  null,
  branch_id:  null,
  fy_id:      null,
};

// ════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════
async function boot() {
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, storageKey: 'qs-auth-token' }
  });

  const { data: { session: s } } = await supabase.auth.getSession();
  if (!s) { window.location.href = '/'; return; }
  session = s;

  // Load tenant_id from users table (UUID join)
  const { data: userData, error: userErr } = await supabase
    .from('users')
    .select('tenant_id')
    .eq('id', s.user.id)
    .single();

  if (userErr || !userData) {
    showError('Could not load your account. Please log in again.');
    setTimeout(() => window.location.href = '/', 2500);
    return;
  }

  od.tenant_id = userData.tenant_id;

  // Check if onboarding already done
  const { data: tenant } = await supabase
    .from('tenants')
    .select('onboarding_step, onboarding_completed_at')
    .eq('id', od.tenant_id)
    .single();

  if (tenant?.onboarding_completed_at) {
    window.location.href = '/';
    return;
  }

  currentStep = Math.max(1, tenant?.onboarding_step || 1);
  renderUI();
}

// ════════════════════════════════════════════════
// UI RENDER
// ════════════════════════════════════════════════
function renderUI() {
  renderDots();
  renderStep(currentStep);
}

function renderDots() {
  document.getElementById('stepDots').innerHTML = STEP_LABELS.map((_, i) => {
    const n = i + 1;
    const cls = n < currentStep ? 'done' : n === currentStep ? 'active' : '';
    return `<div class="step-dot ${cls}">${n < currentStep ? '✓' : n}</div>`;
  }).join('');
  const pct = ((currentStep - 1) / (TOTAL_STEPS - 1)) * 100;
  document.getElementById('progressFill').style.width = `${pct}%`;
}

function renderStep(n) {
  hideError();
  const el = document.getElementById('stepContent');
  const steps = [null, step1, step2, step3, step4, step5, step6, step7];
  el.innerHTML = (steps[n] || (() => ''))();
}

// ════════════════════════════════════════════════
// STEP HTML
// ════════════════════════════════════════════════
function step1() { return `
  <div class="step-title">Company Profile</div>
  <div class="step-desc">Tell us about your business. This information appears on invoices and reports.</div>
  <div class="form-grid">
    <div class="form-group"><label>Company Name *</label><input id="s1_name" placeholder="Acme Corporation" required></div>
    <div class="form-group"><label>Legal Name</label><input id="s1_legal" placeholder="Acme Corporation Ltd."></div>
    <div class="form-group"><label>Tax / VAT ID</label><input id="s1_tax" placeholder="A012345678Z"></div>
    <div class="form-group"><label>Country</label>
      <select id="s1_country">
        <option value="UG">Uganda</option>
        <option value="KE">Kenya</option>
        <option value="TZ">Tanzania</option>
        <option value="NG">Nigeria</option>
        <option value="ZA">South Africa</option>
        <option value="GH">Ghana</option>
        <option value="US">United States</option>
        <option value="UK">United Kingdom</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="form-group"><label>Email</label><input id="s1_email" type="email" placeholder="info@acme.com"></div>
    <div class="form-group"><label>Phone</label><input id="s1_phone" type="tel" placeholder="+256 700 000 000"></div>
    <div class="form-group full"><label>Address</label><input id="s1_addr" placeholder="123 Business Street, City"></div>
  </div>
  <div class="btn-group"><button class="btn-primary" onclick="next()">Continue →</button></div>
`; }

function step2() { return `
  <div class="step-title">Organization Structure</div>
  <div class="step-desc">Define how your company is organized. You can have multiple entities (subsidiaries) and branches under one organization.</div>
  <div class="form-grid">
    <div class="form-group"><label>Organization / Group Name</label><input id="s2_org" placeholder="Acme Group"></div>
    <div class="form-group"><label>First Entity Name</label><input id="s2_entity" placeholder="Acme Uganda"></div>
    <div class="form-group"><label>Entity Code</label><input id="s2_code" placeholder="ACME-UG" maxlength="20"></div>
    <div class="form-group"><label>First Branch / Location</label><input id="s2_branch" placeholder="Headquarters"></div>
  </div>
  <div class="btn-group">
    <button class="btn-secondary" onclick="back()">← Back</button>
    <button class="btn-primary" onclick="next()">Continue →</button>
  </div>
`; }

function step3() { return `
  <div class="step-title">Fiscal Year</div>
  <div class="step-desc">Set your financial reporting year. Monthly accounting periods will be created automatically.</div>
  <div class="form-grid">
    <div class="form-group"><label>Fiscal Year Name</label><input id="s3_name" placeholder="FY 2025" value="FY 2025"></div>
    <div class="form-group"><label>&nbsp;</label></div>
    <div class="form-group"><label>Start Date</label><input id="s3_start" type="date" value="2025-01-01"></div>
    <div class="form-group"><label>End Date</label><input id="s3_end" type="date" value="2025-12-31"></div>
  </div>
  <div class="btn-group">
    <button class="btn-secondary" onclick="back()">← Back</button>
    <button class="btn-primary" onclick="next()">Continue →</button>
  </div>
`; }

function step4() {
  const rows = COA_TEMPLATE.map(a => `
    <div class="coa-row">
      <span class="coa-code">${a.code}</span>
      <span style="flex:1">${a.name}</span>
      <span class="coa-type">${a.type}</span>
    </div>
  `).join('');
  return `
  <div class="step-title">Chart of Accounts</div>
  <div class="step-desc">A standard chart of accounts will be created for your entity. You can add, rename, or customize accounts after setup.</div>
  <div class="info-box">📚 <strong>${COA_TEMPLATE.length} accounts</strong> will be created covering Assets, Liabilities, Equity, Revenue, COGS, and Expenses.</div>
  <div class="coa-preview">${rows}</div>
  <div class="btn-group" style="margin-top:20px">
    <button class="btn-secondary" onclick="back()">← Back</button>
    <button class="btn-primary" onclick="next()">Apply & Continue →</button>
  </div>
`; }

function step5() { return `
  <div class="step-title">Tax Configuration</div>
  <div class="step-desc">Default tax codes will be configured based on your country. You can add more after setup in Settings → Tax.</div>
  <div class="info-box">🧮 Standard tax codes (e.g. VAT 18%, Exempt, Zero-rated) will be added automatically. Custom rates can be configured later.</div>
  <div class="btn-group">
    <button class="btn-secondary" onclick="back()">← Back</button>
    <button class="btn-primary" onclick="next()">Continue →</button>
  </div>
`; }

function step6() { return `
  <div class="step-title">Invite Team Members</div>
  <div class="step-desc">You can invite staff now or skip and do it later from Settings → Users. Each user gets a role with specific access permissions.</div>
  <div class="info-box">👥 Default roles created automatically: <strong>System Admin, AR Officer, AP Officer, Sales Rep, HR Officer, Inventory Manager, Accountant.</strong></div>
  <div class="form-group" style="margin-top:16px">
    <label>Invite by Email (optional — one per line)</label>
    <textarea id="s6_emails" rows="4" placeholder="colleague@example.com&#10;manager@example.com" style="resize:vertical"></textarea>
  </div>
  <div class="btn-group">
    <button class="btn-secondary" onclick="back()">← Back</button>
    <button class="btn-primary" onclick="next()">Finish Setup →</button>
  </div>
`; }

function step7() { return `
  <div class="step-title">Setup Complete!</div>
  <div class="step-desc">Your QuantumServe ERP is ready. All modules, accounts, and permissions are configured.</div>
  <div class="complete-icon">🎉</div>
  <div class="info-box" style="margin-bottom:0">
    ✅ Company profile saved<br>
    ✅ Organization &amp; entity created<br>
    ✅ Fiscal year &amp; 12 periods created<br>
    ✅ ${COA_TEMPLATE.length} accounts configured<br>
    ✅ Default tax codes applied<br>
    ✅ Role-based access ready
  </div>
  <div class="btn-group" style="margin-top:24px">
    <button class="btn-primary" onclick="finish()">Go to Dashboard →</button>
  </div>
`; }

// ════════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════════
async function next() {
  disableButtons(true);
  const ok = await save(currentStep);
  disableButtons(false);
  if (!ok) return;

  if (currentStep < TOTAL_STEPS) {
    currentStep++;
    await supabase.from('tenants').update({ onboarding_step: currentStep }).eq('id', od.tenant_id);
    renderUI();
  }
}

async function back() {
  if (currentStep > 1) {
    currentStep--;
    await supabase.from('tenants').update({ onboarding_step: currentStep }).eq('id', od.tenant_id);
    renderUI();
  }
}

async function finish() {
  await supabase.from('tenants').update({
    onboarding_step: TOTAL_STEPS,
    onboarding_completed_at: new Date().toISOString()
  }).eq('id', od.tenant_id);
  window.location.href = '/';
}

// ════════════════════════════════════════════════
// SAVE HANDLERS (one per step)
// ════════════════════════════════════════════════
async function save(n) {
  hideError();
  try {
    if (n === 1) return await saveStep1();
    if (n === 2) return await saveStep2();
    if (n === 3) return await saveStep3();
    if (n === 4) return await saveStep4();
    if (n === 5) return await saveStep5();
    if (n === 6) return await saveStep6();
    return true;
  } catch (e) {
    showError('An unexpected error occurred: ' + (e.message || e));
    return false;
  }
}

async function saveStep1() {
  const name = val('s1_name');
  if (!name) { showError('Company name is required.'); return false; }

  const { error } = await supabase.from('tenants').update({
    name,
    timezone: 'Africa/Kampala'
  }).eq('id', od.tenant_id);

  if (error) { showError('Failed to save company: ' + error.message); return false; }
  return true;
}

async function saveStep2() {
  const orgName    = val('s2_org')    || 'My Organization';
  const entityName = val('s2_entity') || 'Main Entity';
  const entityCode = val('s2_code')   || 'ENT';
  const branchName = val('s2_branch') || 'Headquarters';

  // Create organization
  const { data: org, error: orgErr } = await supabase
    .from('organizations')
    .insert({ tenant_id: od.tenant_id, name: orgName })
    .select('id').single();

  if (orgErr) {
    // If duplicate, load existing
    const { data: existOrg } = await supabase.from('organizations')
      .select('id').eq('tenant_id', od.tenant_id).eq('name', orgName).single();
    if (existOrg) od.org_id = existOrg.id;
    else { showError('Failed to create organization: ' + orgErr.message); return false; }
  } else {
    od.org_id = org.id;
  }

  // Create entity
  const { data: entity, error: entErr } = await supabase
    .from('entities')
    .insert({ tenant_id: od.tenant_id, organization_id: od.org_id, code: entityCode, name: entityName })
    .select('id').single();

  if (entErr) {
    const { data: existEnt } = await supabase.from('entities')
      .select('id').eq('tenant_id', od.tenant_id).eq('organization_id', od.org_id).eq('code', entityCode).single();
    if (existEnt) od.entity_id = existEnt.id;
    else { showError('Failed to create entity: ' + entErr.message); return false; }
  } else {
    od.entity_id = entity.id;
  }

  if (!od.entity_id) { showError('Entity ID is missing — cannot continue. Please try again.'); return false; }

  // Create branch
  const { error: branchErr } = await supabase.from('branches').insert({
    tenant_id: od.tenant_id,
    entity_id: od.entity_id,
    code: 'HQ',
    name: branchName
  });
  // Ignore duplicate branch errors
  if (branchErr && !branchErr.message.includes('duplicate')) {
    showError('Failed to create branch: ' + branchErr.message); return false;
  }

  return true;
}

async function saveStep3() {
  // Guard: entity_id must exist from step 2
  if (!od.entity_id) {
    // Try to reload from DB
    const { data: ents } = await supabase.from('entities')
      .select('id').eq('tenant_id', od.tenant_id).limit(1).single();
    if (ents) od.entity_id = ents.id;
    else { showError('Organization structure not found. Please go back and complete Step 2.'); return false; }
  }

  const fyName = val('s3_name') || 'FY 2025';
  const start  = val('s3_start') || '2025-01-01';
  const end    = val('s3_end')   || '2025-12-31';

  if (new Date(end) <= new Date(start)) {
    showError('End date must be after start date.'); return false;
  }

  // Upsert fiscal year (avoid duplicate on back/next)
  const { data: fy, error: fyErr } = await supabase.from('fiscal_years')
    .insert({ tenant_id: od.tenant_id, entity_id: od.entity_id, name: fyName, start_date: start, end_date: end })
    .select('id').single();

  if (fyErr) {
    // Load existing FY if duplicate
    const { data: exFy } = await supabase.from('fiscal_years')
      .select('id').eq('tenant_id', od.tenant_id).eq('entity_id', od.entity_id).eq('name', fyName).single();
    if (exFy) { od.fy_id = exFy.id; return true; }
    showError('Failed to create fiscal year: ' + fyErr.message); return false;
  }
  od.fy_id = fy.id;

  // Create 12 monthly periods
  const periods = [];
  const startDt = new Date(start);
  for (let i = 0; i < 12; i++) {
    const pStart = new Date(startDt.getFullYear(), startDt.getMonth() + i, 1);
    const pEnd   = new Date(startDt.getFullYear(), startDt.getMonth() + i + 1, 0);
    periods.push({
      tenant_id:     od.tenant_id,
      fiscal_year_id: od.fy_id,
      period_number: i + 1,
      start_date:    pStart.toISOString().split('T')[0],
      end_date:      pEnd.toISOString().split('T')[0]
    });
  }

  const { error: perErr } = await supabase.from('periods').insert(periods);
  // Ignore duplicate errors (re-running step)
  if (perErr && !perErr.message.includes('duplicate')) {
    showError('Failed to create periods: ' + perErr.message); return false;
  }

  return true;
}

async function saveStep4() {
  if (!od.entity_id) {
    const { data: ents } = await supabase.from('entities')
      .select('id').eq('tenant_id', od.tenant_id).limit(1).single();
    if (ents) od.entity_id = ents.id;
    else { showError('Entity not found. Go back to Step 2.'); return false; }
  }

  const accounts = COA_TEMPLATE.map(a => ({
    tenant_id: od.tenant_id,
    entity_id: od.entity_id,
    code:      a.code,
    name:      a.name,
    type:      a.type,
    subtype:   a.subtype,
    is_active: true
  }));

  const { error } = await supabase.from('accounts').insert(accounts);
  // Duplicate = already inserted (back/next), ignore
  if (error && !error.message.includes('duplicate')) {
    showError('Failed to create accounts: ' + error.message); return false;
  }
  return true;
}

async function saveStep5() {
  // Tax codes are auto-seeded by DB trigger; nothing to insert here.
  // If you have a tax_codes table, insert defaults here.
  return true;
}

async function saveStep6() {
  // Invite emails — optional; real invite flow requires Supabase Auth invite API
  // which needs a service-role key (not safe in client). Skipped silently.
  return true;
}

function val(id) {
  return (document.getElementById(id)?.value || '').trim();
}
function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.style.display = 'block';
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function hideError() {
  document.getElementById('errorBox').style.display = 'none';
}
function disableButtons(disabled) {
  document.querySelectorAll('.btn-primary').forEach(b => {
    b.disabled = disabled;
    b.textContent = disabled ? 'Saving…' : b.textContent.replace('Saving…', 'Continue →');
  });
}
